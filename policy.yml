# Loop-owned policy.
#
# CHARTER.md fixes the direction, the two tests, and the track charges. This
# file holds everything else: how often each track runs, what counts as stale,
# how much any one run may take down. The loop may change these with a stated
# reason in the record. It may not change the charter.
#
# Parts of this file are now parsed rather than read: scripts/dispatch.mjs
# loads the track quotas and enforces them, and scripts/check-publishing-quota.mjs
# enforces the publishing caps. The rest is still prose a run is trusted to
# honour, and the standard stands -- anything that becomes load-bearing should
# get a parser and a check that can fail rather than staying a number a prompt
# is trusted to keep.

# --- Track quotas -----------------------------------------------------------
#
# Relative weights over a rolling window, not a fixed rotation. The dispatcher
# picks the track most owed a run among those with available work.
#
# Scout and maintain dominate on purpose. Most runs should notice things; few
# should publish. Eight runs a day of *publishing* is a content farm, and the
# cadence is meant to buy responsiveness, not volume.
tracks:
  scout:
    weight: 30
    # Scout can always run: its input is the world, not the queue.
    needs_docket_item: false
    # The track whose stock scout supplies. The dispatcher reads this to weight
    # scout by demand: the fuller the fed queue, the less scout is owed.
    # [author] and not [author, build], which was the first shape this design
    # took and is wrong: of scout's 47 filed items the measured split is 41
    # author, 3 build, 3 maintain, 0 meta — scout is 87% an author feeder, and
    # giving build's empty 14-slot budget a vote would pull scout toward filing
    # work it has almost never filed, the signal saying "there is room" while
    # the room is in a track scout does not stock.
    feeds: [author]
    # max_runs_per_day: 1 was removed 2026-08-16. It was the right diagnosis
    # with the wrong instrument: a clock cap bounds a burst but cannot tell a
    # full queue from an empty one, and it kept scout off on the day the queue
    # finally drained. The feeds/fill measurement replaces it — scout is
    # demoted when its stock is full and promoted when author drains, which is
    # demand doing the job a clock could not.
  maintain:
    weight: 25
    needs_docket_item: false   # the staleness report is its queue
  author:
    weight: 15
    needs_docket_item: true
    # queue_budget: how much ready stock this track can actually spend, in the
    # units of its own drain rate — 3 posts/week x 2 weeks = 6. Two weeks of
    # measured drain is the only sizing rule used, and a queue deeper than a
    # fortnight of work is a wishlist. The dispatcher reads this to weight the
    # track by pressure (ready/budget): a full queue doubles its weight, an
    # empty one halves it.
    queue_budget: 6
  build:
    weight: 15
    needs_docket_item: true
    # 20 build items closed in the seven days 08-10..08-16 is 40 in 14; 14 is
    # the ceiling applied to every budget, because a queue deeper than a
    # fortnight of work is a wishlist.
    queue_budget: 14
  audit:
    weight: 10
    needs_docket_item: false
    # Audit is due when this many shipped rounds have gone by without one.
    # Expressed as a gap rather than a rate on purpose: a fixed "N per week"
    # floor fires on a cold start and forces consecutive audit runs with
    # nothing yet to audit. A gap only opens once other work has shipped.
    max_rounds_between_runs: 5
  meta:
    weight: 5
    needs_docket_item: true
    # 7 meta items closed in the seven days 08-10..08-16 is 14 in 14. Note
    # honestly: this was measured while meta's weight suppressed its own drain,
    # so it must be re-measured after this change rather than trusted.
    queue_budget: 14
    # max_share_of_runs: 0.10 was removed 2026-08-16. Over the last forty
    # shipped rounds meta's measured share was 5% against the 10% cap, so the
    # cap never bound that measurement — and the dispatcher's 2x ceiling on
    # pressure bounds meta by construction, which is a stronger guarantee than
    # a cap that was never binding.

# --- Publishing -------------------------------------------------------------
#
# Deliberately decoupled from run cadence. Running often is how the site stays
# responsive; publishing often is how it becomes slop.
publishing:
  max_posts_per_week: 3
  max_posts_per_day: 1

# --- Staleness --------------------------------------------------------------
#
# How long a published claim may go unverified before the preflight treats it
# as urgent. Days.
staleness_days:
  directory_entry: 45
  blog_post: 90
  # Claims about this project's own process go stale fastest and are the ones
  # a sceptical reader checks first. The site has published false claims about
  # its own review process and cadence twice.
  process_claim: 30
  demo: 30

# --- Audit ------------------------------------------------------------------
audit:
  # CHARTER.md rule 12: withdrawals are bounded per run, and a finding that
  # would exceed the bound goes to the maintainer instead of being executed.
  max_withdrawals_per_run: 2

# --- Guardrails -------------------------------------------------------------
#
# The numbers live in lighthouserc.json, which is what CI actually runs. Do not
# copy them here: a threshold restated in a second file drifts from the real
# one the moment somebody retunes it, and the site already reads them from the
# config at build time for exactly that reason.
guardrails:
  source: lighthouserc.json
  # Rule 11: a run blocked by a guardrail may not be the run that loosens it.
  # Tightening is always allowed.
  loosening_requires_separate_run: true

# --- Docket -----------------------------------------------------------------
docket:
  default_expiry_days: 90
  # Past this, an item is reported for pruning. Not a build failure: the queue
  # must not be able to break the site.
  prune_after_expiry_days: 14

# --- DeepSeek peak-hour pricing -----------------------------------------------
#
# docket/open/2026-08-17-deepseek-peak-hour-pricing.md. deepseek-v4-flash --
# the only model this loop runs -- moved to peak/off-peak pricing in August
# 2026. The windows below are OpenCode's, not DeepSeek's own: this account is
# billed through the OpenCode Go subscription (the maintainer's own words,
# 2026-08-17: "Primarily OpenCode Go subscription, but I also have the option
# to use my Zen credits if I hit my rate limits. So, both technically."), and
# OpenCode publishes two different cards for this model -- the Go docs carry
# the peak split, the separate model-data page
# (opencode.ai/data/deepseek/deepseek-v4-flash) still shows a flat rate with
# none, which the maintainer read as that second page simply not having been
# updated for a change that came from the model provider rather than from
# OpenCode. So the Go docs are the ones read here. Fetched from
# https://opencode.ai/docs/go/ on 2026-08-17 (round that filed the item),
# re-fetched unchanged on 2026-08-18, 2026-08-21 and 2026-08-22 (this round).
#
# This is the single place these numbers live. scripts/peak-window.mjs reads
# this block and is the only code that turns a timestamp into a peak/off-peak
# verdict; scripts/orchestrate.sh calls it before every iteration start and
# scripts/orchestrate-peak.sh holds the decision of whether to proceed.
# prompts/orchestrator.md points here rather than restating the numbers --
# a markdown prompt cannot read YAML, and two copies of a time window is how
# this repository's guardrails have drifted before.
deepseek_peak_pricing:
  model: opencode-go/deepseek-v4-flash
  timezone: UTC
  # Half-open [start, end): the boundary minute itself is off-peak. Ordered,
  # non-overlapping, same-day (neither window crosses midnight UTC).
  windows:
    - start: "01:00"
      end: "04:00"
    - start: "06:00"
      end: "10:00"
  rate_per_1m_usd:
    off_peak: { input: 0.22, output: 0.66 }
    peak: { input: 0.44, output: 1.32 }
  # Not read by any check -- Go meters dollars against these ceilings, not
  # tokens, which is what makes peak pricing operational rather than a
  # surprise invoice: it drains the 5-hour ceiling twice as fast. Recorded
  # here because it is the reason the guard below exists.
  allowances_usd: { five_hour: 12, week: 30, month: 60 }
