# runners.yml — the runner registry (specs/loop, "The loop is portable
# across model, provider, and harness").
#
# THIS IS THE ONLY FILE IN THE MACHINERY THAT NAMES A MODEL, A PROVIDER, OR
# A HARNESS. `loop/`, `pulse/`, `scripts/` and `data/config.json` never do.
# If you find a harness name in those paths, that is a bug — the swap
# ("model X, from provider Y, using harness Z, chosen at start time") is only
# real while this file is the single point of change.
#
# It is a RESERVED PATH: the maintainer edits it freely, no job may
# (specs/loop, breaker 4).
#
# IT MUST NEVER CONTAIN A CREDENTIAL. Commands name executables and flags.
# API keys, tokens and logins are the maintainer's, held wherever the harness
# itself keeps them. The loop never reads, writes, passes or prints one.
#
# ---------------------------------------------------------------------------
# Entry schema (specs/loop)
# ---------------------------------------------------------------------------
#   id                        unique, kebab-case. Used by `--runner <id>`, and
#                             recorded on every ledger line.
#   provider                  THE LANE KEY. Runners sharing a provider share a
#                             subscription, so a `capacity` classification on
#                             one pauses all of them (specs/loop). It is the
#                             thing that runs out, not the vendor's brand.
#   tier                      `frontier` | `cheap`. Budget shares are computed
#                             within a tier and never summed across tiers.
#   roles                     which of `author`, `reviewer` this entry is
#                             cleared for.
#   command                   the shell command template that invokes it.
# ---------------------------------------------------------------------------
# Tool access — why the Claude entries carry an explicit --allowedTools list
# ---------------------------------------------------------------------------
# An unattended executor cannot answer a permission prompt. Found the hard way
# on job j-20260828-02: with only `--permission-mode acceptEdits`, every
# network-capable tool came back "requires approval" and the runner honestly
# reported `blocked` — it could not fetch a single source_url, so it refused to
# claim it had verified them. Correct behaviour, impossible job. Verification
# is the loop's core upkeep work and the whole editorial discipline is "fetch
# the source and confirm it says what you claim", so an executor without
# network tools can only do work that needs no sources.
#
# The list is explicit rather than `--dangerously-skip-permissions`, which the
# CLI itself documents as "recommended only for sandboxes with no internet
# access" — the opposite of what this needs. Declaring the tools also states
# what the executor contract actually requires, which belongs here.
#
# Containment is at the git and review layer, not the tool layer: jobs run in a
# disposable worktree outside the repository, under a wall-clock cap, with a
# reserved-path breaker and a mandatory review of a diff the loop computes
# itself.
#
#   capacity_stderr_pattern   optional regex (JS syntax, matched
#                             case-insensitively against the executor's
#                             stderr). A match classifies the run `capacity`
#                             even with no RESULT.md. Per-runner data, never a
#                             global heuristic.
#   model / harness / note    documentation only; nothing reads them.
#   conformance               documentation only: the maintainer's note of
#                             whether `node loop/conformance.mjs --runner <id>`
#                             has been run. The MACHINE-READABLE record lives
#                             in `data/conformance.json` (written by
#                             conformance.mjs, read by the selector) precisely
#                             so that the loop never has to write to this
#                             reserved file.
#
# ---------------------------------------------------------------------------
# Command template placeholders
# ---------------------------------------------------------------------------
#   {prompt_file}   absolute path to the brief, written by the loop as a plain
#                   markdown file. Self-contained: no session, no prior
#                   conversation, no harness-specific syntax.
#   {worktree}      absolute path to the job's worktree. The command is ALSO
#                   spawned with this as its working directory, so most
#                   templates never need it.
#   {job_id}        e.g. j-20260828-01
#   {role}          `author` or `reviewer`
#
# If a template contains no {prompt_file}, the loop pipes the brief on stdin
# instead. That is the whole executor interface: one written prompt in, files
# out, exit or be killed. No memory across invocations, no subagents, no MCP,
# no hooks, no tool-calling API, no structured output, no minimum context
# window, no vendor file layout (specs/loop, executor contract).

version: 1

# The runner used when `--runner` is not given.
default: claude-code-opus

runners:
  - id: claude-code-opus
    provider: anthropic
    tier: frontier
    roles: [author, reviewer]
    model: opus
    harness: claude-code
    command: 'claude --print --permission-mode acceptEdits --allowedTools "Read Write Edit Glob Grep WebFetch WebSearch Bash" --model opus < "{prompt_file}"'
    capacity_stderr_pattern: '(usage limit reached|rate.?limit|quota exceeded|overloaded_error)'
    conformance: unverified
    note: >-
      The setup this repository was built on. Frontier tier, cleared for both
      roles; when it authors and reviews, review keeps fresh-context
      independence but loses family-level diversity (specs/review states that
      as accepted, not as a failure).

  - id: claude-code-sonnet
    provider: anthropic
    tier: cheap
    roles: [author, reviewer]
    model: sonnet
    harness: claude-code
    command: 'claude --print --permission-mode acceptEdits --allowedTools "Read Write Edit Glob Grep WebFetch WebSearch Bash" --model sonnet < "{prompt_file}"'
    capacity_stderr_pattern: '(usage limit reached|rate.?limit|quota exceeded|overloaded_error)'
    conformance: unverified
    note: >-
      Same harness and same subscription as claude-code-opus — deliberately
      the same `provider`, so a capacity pause on one pauses both. This is
      what a lane is: the thing that runs out, not the brand.

  - id: codex-gpt-luna
    provider: openai
    tier: frontier
    roles: [author, reviewer]
    model: gpt-5.6-luna
    harness: codex-cli
    command: 'codex exec -m gpt-5.6-luna -c model_reasoning_effort="max" -c model_context_window=1000000 -c model_auto_compact_token_limit=900000 -c approval_policy="never" -s workspace-write -C "{worktree}" < "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|quota|usage limit|429|insufficient_quota)'
    conformance: unverified
    note: >-
      A third harness, and the one that makes the portability claim
      non-trivial: a different model, a different provider and a different
      CLI from both Claude Code entries.

      Verified against this machine on 2026-08-28 rather than assumed.
      `codex doctor` reports auth configured (mode `chatgpt`, provider
      `openai`) and gpt-5.6-luna as the default model. `codex exec` reads its
      prompt from stdin when none is given as an argument, which is why the
      template redirects the brief in exactly as the Claude entries do.

      Reasoning effort is set IN THE COMMAND, not inherited. The maintainer's
      `~/.codex/config.toml` already carries `model_reasoning_effort = "max"`
      and lists it among `enabled-reasoning-efforts`, but a runner that
      depends on one machine's user config is not a swap — the command
      template is the entire interface, so the flag is explicit here.
      `approval_policy` and the sandbox mode are pinned for the same reason:
      an unattended run must not wait on a prompt that a different config
      would raise.

      The 1M context window is requested explicitly
      (`model_context_window=1000000`, with the complementary
      `model_auto_compact_token_limit=900000`). TWO KNOWN UPSTREAM ISSUES,
      recorded so nobody later mistakes them for a defect here: openai/codex
      #16068 reports that setting `model_context_window` at all can break
      auto-compaction permanently after a first context overflow, and #19185
      reports the context settings sometimes not taking effect, with Codex
      still using roughly 258k. Neither is fatal for this use — a Desk job is
      a single shot from a self-contained brief and should never approach
      either limit — but if a job ever fails on context, look here first.

      NOTE the lane. `provider: openai` is a different lane from the two
      anthropic entries, so exhausting the Claude subscription does not pause
      this runner and vice versa. That is the lane concept doing real work
      rather than being described.

      UNVERIFIED until `node loop/conformance.mjs --runner codex-gpt-luna`
      records four PASSes in data/conformance.json.

  - id: opencode-deepseek
    provider: opencode-go
    tier: cheap
    roles: [author, reviewer]
    model: opencode-go/deepseek-v4-flash
    harness: opencode
    command: 'opencode run --dir "{worktree}" --model opencode-go/deepseek-v4-flash --variant max --auto "Follow the attached brief exactly. End by writing RESULT.md as the brief instructs." --file "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|insufficient balance|quota|429)'
    conformance: unverified
    note: >-
      The advertised swap: a different model, a different provider, a
      different harness, reachable by `node loop/run.mjs --runner
      opencode-deepseek` with no other file edited.

      Identifiers verified against this machine on 2026-08-28 rather than
      assumed. `opencode auth list` holds three credentials — OpenRouter,
      Ollama Cloud and OpenCode Go — and there is no OpenCode Zen provider
      here, so `opencode-go` is both the configured account and the model
      prefix `opencode models` prints. The bare `opencode/` provider carries
      only free models and no deepseek.

      `--variant max` is MANDATORY for this model. Without it the harness
      runs a lower reasoning effort, which the maintainer identified as a
      real quality difference during earlier work on this project.

      ARGUMENT ORDER IS LOAD-BEARING, found by running it. `-f/--file` is an
      ARRAY option, so it consumes every argument that follows it. With the
      message placed after the flag, OpenCode read the instruction as a
      second file path and died with
      `Error: File not found: Follow the attached brief exactly…` — the brief
      never reached the model at all. The message therefore comes first and
      `--file` goes last, where it has nothing left to swallow.

      Conformance found this on its first run: four FAILs, all
      `no RESULT.md at all`, which is the correct verdict for a runner whose
      prompt never arrived.

      UNVERIFIED until `node loop/conformance.mjs --runner opencode-deepseek`
      records four PASSes in data/conformance.json. The selector refuses any
      runner carrying a recorded FAIL.
