# runners.yml — the runner registry (specs/loop, "The loop is portable
# across model, provider, and harness").
#
# THIS IS THE ONLY FILE IN THE MACHINERY THAT NAMES A MODEL, A PROVIDER, OR
# A HARNESS. `loop/`, `pulse/`, `scripts/` and `data/config.json` never do.
# If you find a harness name in those paths, that is a bug — the swap
# ("model X, from provider Y, using harness Z, chosen at start time") is only
# real while this file is the single point of change.
#
# It is a RESERVED PATH: the maintainer edits it freely, no job may
# (specs/loop, breaker 4).
#
# IT MUST NEVER CONTAIN A CREDENTIAL. Commands name executables and flags.
# API keys, tokens and logins are the maintainer's, held wherever the harness
# itself keeps them. The loop never reads, writes, passes or prints one.
#
# ---------------------------------------------------------------------------
# Entry schema (specs/loop)
# ---------------------------------------------------------------------------
#   id                        unique, kebab-case. Used by `--runner <id>`, and
#                             recorded on every ledger line.
#   provider                  THE LANE KEY. Runners sharing a provider share a
#                             subscription, so a `capacity` classification on
#                             one pauses all of them (specs/loop). It is the
#                             thing that runs out, not the vendor's brand.
#   tier                      `frontier` | `cheap`. Budget shares are computed
#                             within a tier and never summed across tiers.
#   roles                     which of `author`, `reviewer` this entry is
#                             cleared for.
#   command                   the shell command template that invokes it.
# ---------------------------------------------------------------------------
# Tool access — why the Claude entries carry an explicit --allowedTools list
# ---------------------------------------------------------------------------
# An unattended executor cannot answer a permission prompt. Found the hard way
# on job j-20260828-02: with only `--permission-mode acceptEdits`, every
# network-capable tool came back "requires approval" and the runner honestly
# reported `blocked` — it could not fetch a single source_url, so it refused to
# claim it had verified them. Correct behaviour, impossible job. Verification
# is the loop's core upkeep work and the whole editorial discipline is "fetch
# the source and confirm it says what you claim", so an executor without
# network tools can only do work that needs no sources.
#
# The list is explicit rather than `--dangerously-skip-permissions`, which the
# CLI itself documents as "recommended only for sandboxes with no internet
# access" — the opposite of what this needs. Declaring the tools also states
# what the executor contract actually requires, which belongs here.
#
# Containment is at the git and review layer, not the tool layer: jobs run in a
# disposable worktree outside the repository, under a wall-clock cap, with a
# reserved-path breaker and a mandatory review of a diff the loop computes
# itself.
#
#   capacity_stderr_pattern   optional regex (JS syntax, matched
#                             case-insensitively against the executor's
#                             stderr). A match classifies the run `capacity`
#                             even with no RESULT.md. Per-runner data, never a
#                             global heuristic.
#   startup_failure_stderr_pattern
#                             optional regex, same matching rules. This one
#                             does NOT change the classification: a run with
#                             no RESULT.md stays `interrupted`, because
#                             specs/loop says so and a guardrail is not
#                             relaxed to make a symptom go away. What it does
#                             is name the cause on the ledger line and count
#                             toward the runner-health refusal, so a
#                             permanently dead credential stops being
#                             invisible.
#
#                             Found by running, on 2026-08-28: an expired
#                             login made this harness print `401
#                             token_expired` and exit in seconds with no
#                             RESULT.md. That classifies `interrupted`, which
#                             keeps the branch resumable, consumes no retry
#                             and trips no breaker — so the Desk would resume
#                             the same branch forever, halting nothing and
#                             telling nobody. The loop now refuses a runner
#                             after three consecutive runs that produced
#                             nothing at all (no RESULT.md, no stdout, no
#                             diff), whether or not a pattern is declared;
#                             this field is what makes the ledger say WHY
#                             rather than just that nothing came back.
#                             Per-runner data, never a global heuristic: only
#                             the maintainer knows what this harness prints
#                             when its login has lapsed.
#   model / harness / note    documentation only; nothing reads them.
#   conformance               documentation only: the maintainer's note of
#                             whether `node loop/conformance.mjs --runner <id>`
#                             has been run. The MACHINE-READABLE record lives
#                             in `data/conformance.json` (written by
#                             conformance.mjs, read by the selector) precisely
#                             so that the loop never has to write to this
#                             reserved file.
#
# ---------------------------------------------------------------------------
# Command template placeholders
# ---------------------------------------------------------------------------
#   {prompt_file}   absolute path to the brief, written by the loop as a plain
#                   markdown file. Self-contained: no session, no prior
#                   conversation, no harness-specific syntax.
#   {worktree}      absolute path to the job's worktree. The command is ALSO
#                   spawned with this as its working directory, so most
#                   templates never need it.
#   {job_id}        e.g. j-20260828-01
#   {role}          `author` or `reviewer`
#
# If a template contains no {prompt_file}, the loop pipes the brief on stdin
# instead. That is the whole executor interface: one written prompt in, files
# out, exit or be killed. No memory across invocations, no subagents, no MCP,
# no hooks, no tool-calling API, no structured output, no minimum context
# window, no vendor file layout (specs/loop, executor contract).

version: 1

# The runner used when `--runner` is not given.
default: claude-code-opus

runners:
  - id: claude-code-opus
    provider: anthropic
    tier: frontier
    roles: [author, reviewer]
    model: opus
    harness: claude-code
    command: 'claude --print --permission-mode acceptEdits --allowedTools "Read Write Edit Glob Grep WebFetch WebSearch Bash" --model opus < "{prompt_file}"'
    capacity_stderr_pattern: '(usage limit reached|rate.?limit|quota exceeded|overloaded_error)'
    startup_failure_stderr_pattern: '(401|403|invalid api.?key|authentication_error|permission_error|oauth .{0,20}expired|token.?expired|please run .{0,12}login|not logged in|credit balance is too low)'
    conformance: unverified
    note: >-
      The setup this repository was built on. Frontier tier, cleared for both
      roles; when it authors and reviews, review keeps fresh-context
      independence but loses family-level diversity (specs/review states that
      as accepted, not as a failure).

  - id: claude-code-sonnet
    provider: anthropic
    tier: cheap
    roles: [author, reviewer]
    model: sonnet
    harness: claude-code
    command: 'claude --print --permission-mode acceptEdits --allowedTools "Read Write Edit Glob Grep WebFetch WebSearch Bash" --model sonnet < "{prompt_file}"'
    capacity_stderr_pattern: '(usage limit reached|rate.?limit|quota exceeded|overloaded_error)'
    startup_failure_stderr_pattern: '(401|403|invalid api.?key|authentication_error|permission_error|oauth .{0,20}expired|token.?expired|please run .{0,12}login|not logged in|credit balance is too low)'
    conformance: unverified
    note: >-
      Same harness and same subscription as claude-code-opus — deliberately
      the same `provider`, so a capacity pause on one pauses both. This is
      what a lane is: the thing that runs out, not the brand.

  - id: codex-gpt-luna
    provider: openai
    tier: cheap
    roles: [author, reviewer]
    model: gpt-5.6-luna
    harness: codex-cli
    command: 'codex exec -m gpt-5.6-luna -c model_reasoning_effort="max" -c model_context_window=1000000 -c model_auto_compact_token_limit=900000 -c approval_policy="never" -s danger-full-access -C "{worktree}" < "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|quota|usage limit|429|insufficient_quota)'
    startup_failure_stderr_pattern: '(401|403|token.?expired|invalid api.?key|unauthorized|not authenticated|please run .{0,12}login|no credentials)'
    conformance: unverified
    note: >-
      A third harness, and the one that makes the portability claim
      non-trivial: a different model, a different provider and a different
      CLI from both Claude Code entries.

      Verified against this machine on 2026-08-28 rather than assumed.
      `codex doctor` reports auth configured (mode `chatgpt`, provider
      `openai`) and gpt-5.6-luna as the default model. `codex exec` reads its
      prompt from stdin when none is given as an argument, which is why the
      template redirects the brief in exactly as the Claude entries do.

      Reasoning effort is set IN THE COMMAND, not inherited. The maintainer's
      `~/.codex/config.toml` already carries `model_reasoning_effort = "max"`
      and lists it among `enabled-reasoning-efforts`, but a runner that
      depends on one machine's user config is not a swap — the command
      template is the entire interface, so the flag is explicit here.
      `approval_policy` and the sandbox mode are pinned for the same reason:
      an unattended run must not wait on a prompt that a different config
      would raise.

      The 1M context window is requested explicitly
      (`model_context_window=1000000`, with the complementary
      `model_auto_compact_token_limit=900000`). TWO KNOWN UPSTREAM ISSUES,
      recorded so nobody later mistakes them for a defect here: openai/codex
      #16068 reports that setting `model_context_window` at all can break
      auto-compaction permanently after a first context overflow, and #19185
      reports the context settings sometimes not taking effect, with Codex
      still using roughly 258k. Neither is fatal for this use — a Desk job is
      a single shot from a self-contained brief and should never approach
      either limit — but if a job ever fails on context, look here first.

      NOTE the lane. `provider: openai` is a different lane from the two
      anthropic entries, so exhausting the Claude subscription does not pause
      this runner and vice versa. That is the lane concept doing real work
      rather than being described.

      CHEAP TIER since 2026-09-07 10:45, the maintainer's decision ("The
      codex Luna runner (all Luna runners actually) should be cheap tier").
      Budget shares are computed within a tier, so this entry now draws on
      the cheap tier's ceilings — and on its shed level: a `capacity` line
      on any cheap-tier lane raises the tier's shed level for 48 hours
      (data/config.json degradation.shed_levels; level 1 excludes post,
      education and scout), which the frontier tier never shared. It is
      the only registered runner on a Luna model; any later Luna entry is
      cheap too.

      SANDBOX DROPPED FOR THIS ENTRY, 2026-09-07, the maintainer's decision
      ("drop the sandbox for the Desk runner only"), measured first: with
      `-s workspace-write` and the user config's `[windows] sandbox =
      "elevated"`, codex-cli 0.146.1 executes commands as a SEPARATE local
      account (git printed the worktree's owner as SID …-1001, the
      maintainer, and "the current user" as SID …-1009), so git 2.40
      refused every job worktree with "detected dubious ownership" and the
      model wrote an honest `blocked:` RESULT.md on the trivial-edit check
      (conformance 09:34: FAIL, PASS, PASS, PASS — the login failure of
      2026-08-28 was gone). `-s danger-full-access` runs the job as the
      maintainer's own account, which is what the two Claude entries
      already do; containment stays where this file says it is, at the git
      and review layer. The interactive Codex configuration is untouched.

      VERIFIED 2026-09-07 09:47 MDT with this template: `node
      loop/conformance.mjs --runner codex-gpt-luna` recorded four PASSes
      (2.61 / 2.28 / 2.26 / 0.66 model-minutes) in data/conformance.json.
      The machine-readable record is the authority; re-run after any change
      to this command.

  - id: opencode-deepseek
    provider: opencode-go
    tier: cheap
    roles: [author, reviewer]
    model: opencode-go/deepseek-v4-flash
    harness: opencode
    command: 'opencode run --attach http://127.0.0.1:4096 --dir "{worktree}" --model opencode-go/deepseek-v4-flash --variant max --auto "Follow the attached brief exactly. End by writing RESULT.md as the brief instructs." --file "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|insufficient balance|quota|429)'
    startup_failure_stderr_pattern: '(401|403|unauthorized|invalid api.?key|token.?expired|not authenticated|no auth|please run .{0,12}(login|auth)|file not found|ECONNREFUSED|connection refused|fetch failed)'
    conformance: unverified
    note: >-
      The advertised swap: a different model, a different provider, a
      different harness, reachable by `node loop/run.mjs --runner
      opencode-deepseek` with no other file edited.

      Identifiers verified against this machine on 2026-08-28 rather than
      assumed. `opencode auth list` holds three credentials — OpenRouter,
      Ollama Cloud and OpenCode Go — and there is no OpenCode Zen provider
      here, so `opencode-go` is both the configured account and the model
      prefix `opencode models` prints. The bare `opencode/` provider carries
      only free models and no deepseek.

      `--variant max` is MANDATORY for this model. Without it the harness
      runs a lower reasoning effort, which the maintainer identified as a
      real quality difference during earlier work on this project.

      ARGUMENT ORDER IS LOAD-BEARING, found by running it. `-f/--file` is an
      ARRAY option, so it consumes every argument that follows it. With the
      message placed after the flag, OpenCode read the instruction as a
      second file path and died with
      `Error: File not found: Follow the attached brief exactly…` — the brief
      never reached the model at all. The message therefore comes first and
      `--file` goes last, where it has nothing left to swallow.

      Conformance found this on its first run: four FAILs, all
      `no RESULT.md at all`, which is the correct verdict for a runner whose
      prompt never arrived.

      UNVERIFIED until `node loop/conformance.mjs --runner opencode-deepseek`
      records four PASSes in data/conformance.json. The selector refuses any
      runner carrying a recorded FAIL.

      ATTACHED SINCE 2026-09-07 (the maintainer's instruction): `--attach
      http://127.0.0.1:4096` makes every run a session on one headless
      server instead of a private in-process one. The server, how to start
      it, and what happens when it is down are documented once, on the
      opencode-muse-spark entry below. The conformance record dated
      2026-08-28 was made WITHOUT the flag; re-run before relying on it.

  - id: opencode-muse-spark
    provider: opencode-go
    tier: cheap
    roles: [author, reviewer]
    model: opencode-go/muse-spark-1.3-contributor
    harness: opencode
    command: 'opencode run --attach http://127.0.0.1:4096 --dir "{worktree}" --model opencode-go/muse-spark-1.3-contributor --variant high --auto "Follow the attached brief exactly. End by writing RESULT.md as the brief instructs." --file "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|insufficient balance|quota|429)'
    startup_failure_stderr_pattern: '(401|403|unauthorized|invalid api.?key|token.?expired|not authenticated|no auth|please run .{0,12}(login|auth)|file not found|ECONNREFUSED|connection refused|fetch failed)'
    conformance: unverified
    note: >-
      Added 2026-09-07 on the maintainer's instruction ("I want to try a new
      model runner"): Muse Spark 1.3 Contributor, on the same OpenCode Go
      account and the same OpenCode harness as opencode-deepseek — so the
      SAME LANE (`provider: opencode-go`): a capacity pause on either pauses
      both, which is what sharing a subscription means here.

      Identifiers verified against this machine the same day rather than
      assumed. `opencode models` (opencode 1.18.18) lists
      `opencode-go/muse-spark-1.3-contributor` (release 2026-09-02, context
      1,048,576, output 131,072, reasoning and tool calls on); the bare
      `opencode/muse-spark-1.3-contributor-free` row is the free tier, and
      the OpenRouter rows are a different lane. The variants this model
      declares are minimal / low / medium / high / xhigh — there is NO
      `max` here, unlike deepseek-v4-flash, so the template asks for
      `high`; raise it to `xhigh` in this file if the review gate says the
      work is thin.

      The template is otherwise the deepseek one verbatim, including the
      load-bearing argument order (message first, `--file` last).

      THE SERVER, and why `--attach` (the maintainer's instruction,
      2026-09-07). Measured that morning: without `--attach`, each
      `opencode run` is a private in-process session — it listens on no
      port and holds no connection to any local server, only HTTPS to
      opencode.ai — and a child of it can still hold the worktree for a
      second after it returns (loop/conformance.mjs now retries removal).
      With `--attach http://127.0.0.1:4096` every run is a session on one
      headless server, visible in the TUI and shareable across runs. Start
      it (it does not survive a reboot; nothing under scripts/ may name a
      harness, so the command lives here):

        opencode serve --port 4096 --hostname 127.0.0.1

      started detached, stdout/stderr to D:/addictedtoai-worktrees/
      opencode-serve-4096.log and .err.log, loopback only. If it is down,
      `opencode run --attach` fails at once with a refused connection —
      which is why ECONNREFUSED / "connection refused" / "fetch failed"
      are in the startup-failure pattern: the ledger line then names the
      cause and the runner-health refusal counts it, instead of three
      silent `interrupted` runs.

      PORT HYGIENE, also measured 2026-09-07: until the maintainer disabled
      the `opencode` MCP bridge for this project (and two others) in
      Claude Code's settings that morning, every Desk `claude --print`
      started the session's MCP servers (addictedtoai-h7zt), and that
      bridge spawned its own `opencode serve --port=4096` for the life of
      the job phase — pids 26964 (07:51, the author) and 19208 (08:16, the
      reviewer) — so 4096 was taken and released with every phase. With
      the bridge disabled nothing but this server binds 4096.

      UNVERIFIED until `node loop/conformance.mjs --runner opencode-muse-spark`
      records four PASSes in data/conformance.json. The selector refuses any
      runner carrying a recorded FAIL.

  - id: opencode-openrouter-muse-spark
    provider: openrouter-account
    tier: cheap
    roles: [author, reviewer]
    model: openrouter/meta/muse-spark-1.3-contributor
    harness: opencode
    command: 'opencode run --attach http://127.0.0.1:4096 --dir "{worktree}" --model openrouter/meta/muse-spark-1.3-contributor --variant high --auto "Follow the attached brief exactly. End by writing RESULT.md as the brief instructs." --file "{prompt_file}"'
    capacity_stderr_pattern: '(rate.?limit|insufficient balance|quota|429)'
    startup_failure_stderr_pattern: '(401|403|unauthorized|invalid api.?key|token.?expired|not authenticated|no auth|please run .{0,12}(login|auth)|file not found|ECONNREFUSED|connection refused|fetch failed)'
    conformance: unverified
    note: >-
      The same model as opencode-muse-spark at the same Contributor price,
      on a DIFFERENT LANE: `provider: openrouter-account` is its own
      subscription and its own rate limits, so the pause the Go lane earns
      from a `capacity` line does not touch this entry, and vice versa.
      The lane key is not the bare word `openrouter` on purpose: the
      portability test forbids every registered provider name inside
      `loop/`, and the machinery must be able to name the Pulse source
      `openrouter-models` (the site's price feed, a subject of the site and
      not a runner) — a bare `openrouter` lane made that legitimate mention
      read as a leaked harness name.

      ACCOUNT GATE, measured 2026-09-07 10:30: OpenRouter refuses this
      model until the account confirms 18+ at
      https://openrouter.ai/settings/preferences ("This model requires you
      to complete the following before use: 18+ age confirmation"). The
      first conformance run recorded four FAILs, all "no RESULT.md", for
      that reason alone; re-run after the maintainer confirms.

      HOW IT GOT HERE, 2026-09-07. The first trial job on OpenCode Go
      (opencode-muse-spark) hit that provider's short-window rate limit 29
      model-minutes in, one step before writing RESULT.md. The maintainer
      asked for the job to finish on OpenCode Zen; the same job then ran
      to completion on `opencode/muse-spark-1.3` (Zen's only paid row,
      $1.25 / $4.25 per million, the full non-Contributor price — Zen
      carries no paid Contributor row, only the free one, which this
      project has never used). He then chose this row instead:
      "'openrouter/meta/muse-spark-1.3-contributor' sorry I was mistaken
      about there being a paid, contributor option for opencode zen". The
      Zen entry that ran that one job (id opencode-zen-muse-spark, commit
      3543c05) is replaced by this one; its conformance record went with
      it.

      Identifiers verified against this machine the same day: with the
      OpenRouter credential present, `opencode models` lists
      `openrouter/meta/muse-spark-1.3-contributor` — "Muse Spark 1.3
      Contributor", $0.10 in / $0.20 out per million tokens, variants
      minimal/low/medium/high/xhigh/max. `--variant high` matches the
      other Muse entries; `max` exists here and does not on the OpenCode
      rows, so raise it in this file if the review gate says the work is
      thin. The Contributor terms (the vendor trains on the traffic) are
      OpenRouter's to enforce on that account.

      Same attached template as the other OpenCode entries; the server is
      documented on opencode-muse-spark.

      UNVERIFIED until `node loop/conformance.mjs --runner opencode-openrouter-muse-spark`
      records four PASSes in data/conformance.json. The selector refuses any
      runner carrying a recorded FAIL.
