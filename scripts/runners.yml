# The one place harness, provider, model and variant are named as
# independent fields for a loop run. The maintainer's own sentence should
# resolve from this file alone: "start the loop using model X through
# provider Y inside harness Z." See docket/briefs/loop-meta-runner-config.md
# for the round that built this (loop/meta/runner-config).
#
# Before this file, scripts/orchestrate.sh hardcoded
# MODEL="opencode-go/deepseek-v4-flash" and invoked `opencode run` directly
# at its launch line, fusing harness + provider + model into one string in
# one script -- with a second, independently-typed copy of that same model
# string in policy.yml's deepseek_peak_pricing block and nothing keeping the
# two in sync. scripts/orchestrate.sh now reads this file instead (via
# scripts/runner-preflight.mjs); policy.yml now holds a `runner:` reference
# into this file rather than a second literal, checked equal by
# scripts/check-runner-config.mjs.
#
# scripts/runner-preflight.mjs and scripts/orchestrate.sh are the only
# intended readers. If you find a model, provider or harness string
# hardcoded somewhere else in this repository, it is a duplicate of this
# file waiting to drift -- reconcile it the way check-runner-config.mjs
# reconciles policy.yml's copy, don't just edit the string in place.
#
# NEVER SILENTLY SUBSTITUTE. A runner does not choose itself.
# scripts/runner-preflight.mjs resolves $ORCHESTRATE_RUNNER (or
# default_runner below) and CHECKS it, by name, before
# scripts/orchestrate.sh launches anything. If a check fails, the loop
# stops that iteration and says which check failed -- it never falls back
# to a different runner, a different model, or a default variant.
# CHANGELOG.md's `Agent:` field is published provenance: a record saying
# one model did work another model did is exactly the class of false claim
# docket/briefs/'s own convention (round 9, 2026-08-23) exists to keep out
# of this project's record.

default_runner: opencode-go-deepseek-max

runners:
  # The runner every automated round has actually used so far --
  # CHANGELOG.md's `Agent:` field carries `opencode`, `opencode
  # (deepseek-v4-flash)` and `opencode/deepseek-v4-flash` roughly 75 times
  # (grep -h "^- Agent:" CHANGELOG.md | sort | uniq -c, run this round).
  # Billed through the OpenCode Go subscription, with documented
  # peak/off-peak pricing -- see policy.yml's deepseek_peak_pricing block.
  opencode-go-deepseek-max:
    harness: opencode
    provider: opencode-go
    model: deepseek-v4-flash
    variant: max

  # OpenCode Zen. Written for completeness, not for use: this round found
  # (GET http://127.0.0.1:4097/provider, read-only, this machine, 2026-08-23)
  # that Zen's own catalogue on this account lists `deepseek-v4-flash-free`,
  # not bare `deepseek-v4-flash` -- so scripts/runner-preflight.mjs fails
  # this runner's "model in catalogue" check by construction, not by the
  # exclusion pattern below (the exclusion pattern would also catch the
  # `-free` model actually offered, if this entry named it correctly; it is
  # deliberately left naming the same model id as the Go runner above, to
  # keep both entries' `model:` field honest about what was actually asked
  # for rather than pre-adjusted to whatever passes).
  opencode-zen-deepseek-max:
    harness: opencode
    provider: opencode
    model: deepseek-v4-flash
    variant: max

  # Ran real rounds already (CHANGELOG.md: `Agent: claude-code` x13,
  # `Agent: claude-sonnet-5 (Claude Code subagent)` x8, `Agent: claude-opus-5
  # (orchestrating model)` x4) but always dispatched directly by an
  # orchestrator session, never by scripts/orchestrate.sh's supervisor loop
  # -- see harnesses.claude-code.supervisor below. Its launch adapter
  # (scripts/harness-adapters/claude-code.sh) is written from the CLI's
  # documented non-interactive flags and has not been exercised this round:
  # doing so would start a real, billed session, which this round's working
  # rules forbid spending without being asked to.
  claude-code-sonnet-5:
    harness: claude-code
    provider: anthropic
    model: claude-sonnet-5
    variant: null

  # The model orchestrating and running rounds as of 2026-08-24, and the
  # entry whose absence made CHANGELOG.md's `Agent:` field unresolvable:
  # `Agent: claude-opus-5 (orchestrating model)` x4 and `Agent: claude-opus-5
  # (Claude Code subagent)` x3 (grep -c, run this round) named a model no
  # runner registered, while the only Claude entry here was the Sonnet one
  # above. scripts/check-changelog-provenance.mjs now resolves every
  # `Agent:` from round 185 forward against this file, so a round on an
  # unregistered runner is a red build rather than a line of free text.
  #
  # Named for shape consistency with claude-code-sonnet-5 (harness first,
  # then model) rather than as a bare `claude-opus-5`; the record publishes
  # the MODEL, which is why that checker resolves an `Agent:` value against
  # runner keys and runner `model:` values alike.
  #
  # Same adapter caveat as claude-code-sonnet-5 above, and it is the honest
  # one: scripts/harness-adapters/claude-code.sh has still never been
  # exercised. Every round this model has run was dispatched directly by an
  # orchestrator session -- see harnesses.claude-code.supervisor below --
  # so registering it here records what is true, and does not claim the
  # supervisor launch path has been tried.
  claude-code-opus-5:
    harness: claude-code
    provider: anthropic
    model: claude-opus-5
    variant: null

  # Ran real rounds already (CHANGELOG.md: `Agent: codex` x17). Same caveat
  # as claude-code-sonnet-5 above: adapter written, not exercised this round.
  codex:
    harness: codex
    provider: openai
    model: gpt-5-codex
    variant: null

# Exclusions, checked against whichever runner is selected -- a runner
# entry above cannot exempt itself from a standing instruction by being the
# one picked. FRAME.md fact 18: OpenCode's free-tier model variants are
# excluded absolutely, by standing instruction.
#
# WHAT "ABSOLUTE" ACTUALLY MEANS HERE, STATED PLAINLY: this is a name-based
# check, not a provable one, and adversarial review (this round) demonstrated
# exactly why that gap matters, not just that it exists in theory. The first
# version of this pattern was `-free$` -- true of every free-tier model
# example anyone had looked at when it was written, and wrong: the live
# catalogue (GET http://127.0.0.1:4097/provider, read-only, checked this
# round) uses at least three separator conventions across the 395 models
# reachable through this account's 4 connected providers --
# `nvidia/...:free` (16 models, openrouter), `...gpt-oss-20b:free` (the
# reviewer's own live reproduction), `deepseek/...-free` (6 models), and
# `openrouter/free` (1 model, a bare slash-suffixed id) -- 23 in total, all
# caught by a plain case-insensitive substring test for "free", zero caught
# by `-free$` alone beyond its own 6. FRAME.md fact 18's own check
# (`/free/i` against a live session's id/variant/providerID, unanchored) was
# already less wrong than this file's `-free$` was -- this pattern now
# matches that precedent instead of a narrower one this file invented
# independently.
#
# So: word-boundary, case-insensitive, unanchored to any one separator --
# `free` as its own token anywhere in the id, which is what actually
# generalises past "the conventions currently known" rather than
# re-enumerating them (a fourth separator character would still match; a
# provider naming a free tier without the word "free" at all -- "trial",
# "oss", a bare model name with no marker -- would not, and nothing here
# claims otherwise). scripts/check-free-model-exclusion.mjs re-derives this
# exact set from the live catalogue every time it can reach one and fails
# the build if a "free"-named reachable model is not excluded by this
# pattern -- verified drift detection, not a one-time claim -- and reports
# UNVERIFIED, never a silent PASS, when no server is reachable (the same
# convention FRAME.md's own checks use).
#
# A cost-based check was considered and rejected as the primary mechanism:
# every model object in the live catalogue carries a real `cost.input`/
# `cost.output` field, and cost 0 is a stronger, convention-independent
# signal for "this specific model is free to call" than any name pattern
# could ever be. It was not adopted because it does not mean the same thing
# as this instruction: among this account's connected providers, every
# `ollama-cloud` model reports cost 0 across its entire catalogue (a
# subscription/quota-based provider, most likely a pricing-data gap in that
# catalogue entry rather than a genuine free-tier claim) and would have been
# excluded wholesale under a pure cost-0 rule -- disabling a legitimate
# connected provider this instruction was never stated to reach. Recorded
# here rather than silently discarded: this is the residue a future round
# should resolve with the maintainer, not guess at.
excluded_model_patterns:
  - pattern: "(^|[^a-z0-9])free([^a-z0-9]|$)"
    flags: "i"
    reason: >-
      OpenCode free-tier model variants are excluded absolutely, by standing
      instruction (FRAME.md fact 18). Matches "free" as its own token
      anywhere in the model id, case-insensitively -- not anchored to one
      separator convention; see the header above for what this can and
      cannot catch.

# What differs by harness, and only by harness: how a round is launched, and
# how it is known to be alive. Everything else the loop does -- briefs,
# docket, changelog, review artifacts, git -- is already harness-agnostic
# text and needs no adapter (this round's own "why" section says so). Each
# adapter is a small shell file under scripts/harness-adapters/, sourced by
# scripts/orchestrate.sh, defining a `launch` function with the same
# signature regardless of harness -- the contract is stated once, in
# opencode.sh's header, since it was written first.
#
# "supervisor" states, for each harness, whether scripts/orchestrate.sh's
# supervisor loop is the thing launching it today. This is NOT a property of
# the harness itself -- it is a property of the launcher, restated per
# harness only because exactly one launcher (the supervisor) exists to ask
# today. A scheduled run needs a supervisor process for cadence and restart,
# whatever the harness; an orchestrator-launched run needs no supervisor,
# because the orchestrator already is the supervisor for that round. The
# claude-code and codex rows read `supervisor: false` because that already
# describes how every round on those harnesses actually happened -- an
# orchestrator session dispatching directly -- not because this file is
# deciding it on their behalf.
#
# Liveness for the opencode harness stays in scripts/orchestrate-liveness.sh,
# unmoved by this round: scripts/test-orchestrate-checkout.mjs sources it by
# that exact path, and moving already-tested code for this round's sake
# would be risk for no behaviour change. Read that file as "the opencode
# adapter's liveness half" -- this round reframes it, it does not relocate
# it.
harnesses:
  opencode:
    adapter: scripts/harness-adapters/opencode.sh
    presence_check: opencode
    needs_server: true
    server_url: http://127.0.0.1:4097
    supervisor: true

  claude-code:
    adapter: scripts/harness-adapters/claude-code.sh
    presence_check: claude
    needs_server: false
    supervisor: false

  codex:
    adapter: scripts/harness-adapters/codex.sh
    presence_check: codex
    needs_server: false
    supervisor: false
