name: PR checks

# Guardrail gate: every PR (including the loop's own) must pass this
# before it's mergeable. Auto-merge policy is set in branch protection,
# not here — see README.md.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # CHARTER.md rule 13a: the record's integrity, the stop mechanism, and 13a
  # itself stay reserved regardless of the delegation rule 13 records. This
  # job guards the part of that surface a path prefix can express: the
  # workflow definitions in `.github/` (the enforcement mechanism, not the
  # content rule 13 delegates) and `scripts/check-track-scope.mjs` (the
  # scope-boundary definition, guarded here since round 79 for the reason
  # below). Rule 13a's own text inside CHARTER.md is a third, narrower thing
  # this job also guards -- not by path, since CHARTER.md as a whole is no
  # longer reserved, but by content -- see the `rule-13a-text` job below.
  #
  # UNTIL 2026-08-22 this job also failed on any pull request touching
  # CHARTER.md and prompts/, full stop, because rule 13 called both
  # human-owned outright. It no longer does: the 11 August delegation, and
  # its 22 August broadening, cover ordinary edits to both, and CHARTER.md's
  # own History (2026-08-22) records why the old blanket gate was withdrawn
  # rather than kept as an extra margin of safety -- a required check that
  # fails on every legitimate change trains people to merge past it, and the
  # last two merges that touched these paths did exactly that
  # (`enforce_admins: false`, documented below). A red `human-owned-paths`
  # should mean something is genuinely wrong; failing on ordinary charter and
  # prompt edits stopped meaning that a long time before this comment was
  # rewritten to say so.
  #
  # CODEOWNERS was supposed to be what made the old, broader version of this
  # true. It was not. Branch protection on main sets
  # `require_code_owner_reviews: true` alongside
  # `required_approving_review_count: 0`, and with no approval required there
  # is nothing for the code-owner rule to demand -- so PR #16 changed this
  # very file and merged with zero reviews on 2026-08-11. A required status
  # check has no equivalent hole: it is not satisfiable by an empty set.
  #
  # This job therefore fails, by design and with no exception, on any pull
  # request touching those paths. Auto-merge cannot land a red required check,
  # so the pull request waits for the maintainer to merge it by hand -- and
  # that act is the review. Its failure means "this needs a human", not "this
  # is broken", which is why it is a separate job rather than a step inside
  # build-and-audit: two different facts should not share one signal.
  #
  # !! IT DOES NOT BITE UNTIL IT IS A REQUIRED CHECK. !!
  # Auto-merge waits only on checks listed as required in branch protection.
  # Until `human-owned-paths` is added to that list, this job will correctly
  # report the problem and then watch the merge happen anyway. Adding it is a
  # settings change; nothing in this repository can make it for itself, which
  # is the point. It was added to that list on 2026-08-11 and PR #25 is the
  # first pull request it actually stopped.
  #
  # scripts/check-track-scope.mjs, ADDED ROUND 79: it is where a round can
  # rewrite what every other path check means. check-track-scope.mjs runs
  # from the branch it is judging, so a run can add a path to its own track's
  # SCOPES and spend that path in the same pull request -- the checker
  # consults the branch's copy of the rules and agrees with it. Round 78 did
  # this: it granted meta `app/lib/route-files.js` and created that file in
  # one pull request, and every check was green. Rule 11 says a run blocked
  # by a guardrail may not be the run that loosens it, and nothing mechanical
  # was enforcing that.
  #
  # This does not close that hole -- the checker still reads its rules from the
  # branch, and 2026-08-11-track-scope-judges-itself.md stays open for the fix
  # that does. It makes the hole cost a human merge, which is the same shape as
  # rule 11's remedy: a round may still propose a scope change, it just cannot
  # be the one that approves it.
  human-owned-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs the merge base to diff against, like check-track-scope.
          fetch-depth: 0

      - name: Fail if this pull request changes the enforcement mechanism
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          # Prefix match, deliberately not anchored at the end. A guard that
          # over-matches costs a human one unnecessary merge; a guard that
          # under-matches is a bypass. So check-track-scope.mjs.orig is
          # guarded too, and that is the right direction to be wrong in.
          #
          # Three more files joined 2026-08-22, same round as rule 13a
          # itself: scripts/check-13a-unchanged.mjs, scripts/check-hold-
          # mechanism.mjs and scripts/test-orchestrate-hold.mjs are the
          # enforcement logic for two of rule 13a's own reservations (its own
          # text, and the stop mechanism). None of the three is a workflow
          # file, so none was in .github/ or otherwise reserved -- meaning a
          # pull request could weaken or gut any of them in the same diff
          # that violates what they check, and every job here would still
          # report green, because the job definitions in .github/ (protected)
          # only say "run this script," not what the script does. The exact
          # round-78 shape check-track-scope.mjs was guarded for in 2026-08-11,
          # recurring in new code the same round it shipped. Not a complete
          # fix -- scripts/check-routes.sh, which wires
          # test-orchestrate-hold.mjs into build-and-audit, is not guarded
          # here, and gating it would freeze a file every track edits often
          # for unrelated route checks; CHARTER.md's History (2026-08-22)
          # names this residual rather than leaving it implicit.
          owned=$(printf '%s\n' "$changed" \
            | grep -E '^(\.github/|scripts/check-track-scope\.mjs|scripts/check-13a-unchanged\.mjs|scripts/check-hold-mechanism\.mjs|scripts/test-orchestrate-hold\.mjs)' \
            || true)
          if [ -n "$owned" ]; then
            echo "This pull request changes paths CHARTER.md rule 13a reserves:"
            printf '%s\n' "$owned" | sed 's/^/    /'
            echo ""
            echo "rule 13a reserves the enforcement mechanism -- .github/ (the checks"
            echo "and their required-status wiring), scripts/check-track-scope.mjs"
            echo "(the map of which paths each track may write, guarded since round 79:"
            echo "it reads that map from the branch it is judging, so a round can"
            echo "otherwise grant itself a path and spend it in the same pull request --"
            echo "round 78 did), and the three checking scripts rule 13a's own text and"
            echo "the stop mechanism depend on, guarded for the identical reason. Rule"
            echo "11: the run a guardrail blocks is not the run that loosens it."
            echo ""
            echo "This check fails so auto-merge cannot land it. A maintainer merges"
            echo "it by hand, and that act is the review."
            exit 1
          fi
          echo "ok  no reserved enforcement paths touched"

  # CHARTER.md rule 13a: "this rule itself -- only the maintainer may amend
  # rule 13a." Path-based guarding cannot express that on its own, because
  # CHARTER.md as a whole is no longer reserved (the job above stopped
  # failing on it 2026-08-22) -- a content check is what enforces the one
  # clause inside that file which stays reserved. Reads rule 13a's own text
  # out of CHARTER.md by its "13a." marker (the same one
  # scripts/check-13a-unchanged.mjs's header explains app/lib/charter.js's
  # renderer does not recognise as a numbered rule) and fails if it differs
  # from the base ref's by so much as a byte, or if either ref carries more
  # than one "13a." marker -- a second, decoy marker with the base's exact
  # text would otherwise extract clean while the real clause below it was
  # edited freely, which is exactly the kind of gap this file exists to
  # close, not reproduce. Passes, deliberately, if the base ref has no rule
  # 13a at all -- so the pull request that first adds it is never blocked by
  # a check protecting text that isn't there yet.
  #
  # !! NOT YET A REQUIRED CHECK. !!
  # Read live from the GitHub API on 2026-08-22, the same day this job was
  # added: `gh api repos/addicted2ai/AddictedtoAI/branches/main/protection/
  # required_status_checks --jq '.contexts'` returns exactly
  # ["build-and-audit","human-owned-paths","review-artifact"]. This job's
  # name is not in that list. Auto-merge waits only on required checks
  # (see the two banners on the jobs beside this one), so today this job can
  # report a violation of the one clause in CHARTER.md the loop may never
  # amend, and auto-merge will land the pull request anyway. Adding a job to
  # the required list is a branch-protection settings change, and rule 13a
  # itself reserves repository settings -- so the loop that just wrote this
  # job cannot be the one that arms it, the same bootstrapping gap
  # `human-owned-paths` had between 2026-08-11 (created) and 2026-08-11
  # (added to the required list, PR #25 the first pull request it actually
  # stopped) -- neither of which was tracked as a docket item either; the
  # loud banner is the disclosure mechanism this repository already used
  # twice. Not filed as a new docket item here either: `meta`'s open queue
  # was already 26 items against a `queue_budget` of 14 in `policy.yml` when
  # this job was written, and `check-docket.mjs`'s filing gate correctly
  # refuses to let a `track: meta` item grow it further -- the same wall
  # CHARTER.md's History (2026-08-22) already records for the stop-mechanism
  # gap this file's next job closed. See that History entry for both.
  rule-13a-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify rule 13a's own text is unchanged from the base ref
        run: node scripts/check-13a-unchanged.mjs "origin/${{ github.base_ref }}"

  # CHARTER.md rule 13a also reserves "the stop mechanism -- docket/HOLD.md
  # and the code paths that honour it" -- today the loop's own signal to
  # itself, not a channel the maintainer currently uses to intervene (every
  # prior use was the loop halting itself; see CHARTER.md's History,
  # 2026-08-22), reserved because it becomes a genuine remote brake once
  # scheduled runs resume. This job covers only the half a PR diff can
  # actually answer: whether THIS pull request's own change to
  # docket/HOLD.md clears an active hold (creating one, or editing an active
  # hold's stated reason, is not the reserved act -- this project's own
  # history holds several legitimate self-merged pauses and releases).
  #
  # THIS JOB USED TO ALSO FREEZE the `if [ -s docket/HOLD.md ]; then halt
  # ...; fi` fragment in scripts/orchestrate.sh byte for byte. Adversarial
  # review defeated that, then defeated its replacement, across three
  # passes: (1) truncating docket/HOLD.md every iteration, above the frozen
  # block, so `-s` never sees content; (2) gutting halt() (defined
  # elsewhere in the same file), so the frozen block's call to it does
  # nothing; (3) clearing the file from a detached background job after the
  # script had already halted and logged correctly -- defeating the
  # behavioural replacement scripts/test-orchestrate-hold.mjs shipped for
  # (1) and (2), and exposing that the first two review passes had posed
  # the question against the wrong threat model: `git log --all -- docket/
  # HOLD.md` shows every use of this file was the loop halting itself, never
  # a human reaching into a live one, because nothing has run unattended
  # since 2026-08-18 -- so an adversary evading a live human command is not
  # a shape this project's history shows, and the third bypass is left
  # undefended on purpose rather than patched a fourth time.
  # scripts/check-hold-mechanism.mjs's own header has the full account.
  #
  # THE BEHAVIOURAL HALF lives in scripts/test-orchestrate-hold.mjs, which
  # does not diff text at all: it actually runs the real
  # scripts/orchestrate.sh in an isolated sandbox against a controlled
  # docket/HOLD.md and reads what it did, including two permanent
  # regression cases (bypasses 1 and 2, both plausible as accidental
  # regressions) that assert the harness still catches both. It is wired
  # into scripts/check-routes.sh, which `build-and-audit` below already
  # runs -- a required check today, unlike this job. That test's own limit
  # is stated in its header rather than implied: it proves this
  # repository's code halts when actually run, which is what it needs to
  # prove against the threat it actually defends against (accidental
  # regression, not adversarial evasion); it does not prove the
  # orchestrate.sh process running on whatever machine the maintainer
  # started it on, at any given moment, is this code, unmodified, and it
  # does not defend against bypass 3 at all, by choice.
  #
  # !! NOT YET A REQUIRED CHECK (this job only). !! Same gap, same reason,
  # same "not filed either -- meta's queue is over budget" note as
  # rule-13a-text above; see that job's banner and CHARTER.md's History,
  # 2026-08-22.
  stop-mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify this pull request's diff does not clear an active hold
        run: node scripts/check-hold-mechanism.mjs "origin/${{ github.base_ref }}"

  # A round that declares `Origin: delegated` claims the orchestrating model
  # reviewed it before merge. A review asserted in the changelog is not a
  # review; a review is a file, and this job requires the file and that it
  # cover the tree being merged.
  #
  # For a delegated round it requires all of:
  #   - a file docket/reviews/<sha>.md on the branch,
  #   - its `Verdict:` line reads `approve`,
  #   - its `Commit:` SHA is an ancestor of, or equal to, the pull request
  #     head, and
  #   - `git diff --name-only <that sha>..HEAD` lists nothing outside
  #     `docket/reviews/`.
  #
  # The last condition is the load-bearing one. It proves nothing substantive
  # changed after the reviewer looked, so a review of an earlier commit never
  # vouches for later code -- that failure has happened here once already,
  # when CI went green on one commit and the corrected commit was different.
  # It also resolves the circularity of committing the review: the artifact
  # can never name the head it lands on, because committing it changes the
  # head. It names what it read, and the diff proves the difference is only
  # the review itself.
  #
  # !! THIS IS A REQUIRED CHECK, SINCE 2026-08-17. !!
  # Auto-merge waits only on checks listed as required in branch protection,
  # and the maintainer added this job to that list on 2026-08-17. Read from the
  # API that day, the required contexts on main are
  # ["build-and-audit","human-owned-paths","review-artifact"]. So a delegated
  # round whose artifact is missing, does not approve, or does not cover the
  # merged tree cannot land on green. `scripts/round.mjs ship` runs this same
  # script (same rule, same parser) before it will arm auto-merge, which stops
  # the sanctioned path one step earlier; this job is what stops the rest.
  #
  # This comment said the opposite until 2026-08-17 -- that the job was visible
  # rather than required -- and it was wrong for the last stretch of that
  # window. A file describing this project's own gate as weaker than it is, is
  # the same defect as one describing it as stronger.
  #
  # TWO THINGS BEING REQUIRED DOES NOT BUY.
  # enforce_admins is false, so the account the loop operates as can merge past
  # a red required check: docket/open/2026-08-11-branch-protection-does-not-require-review.md.
  # And this check reads the Origin it applies to out of the branch it is
  # judging, so a round that declares anything other than `delegated` exempts
  # itself from it. Round 152 did that by accident -- its pull request read
  # CLEAN and mergeable while carrying a request-changes artifact, and
  # correcting one word to `delegated` turned this job red and the pull
  # request BLOCKED. See
  # docket/open/2026-08-17-origin-is-self-declared-in-the-tree-it-gates.md.
  #
  # The Origin is read through the same parser the site builds from
  # (app/lib/build-log.js) -- never a second parser. A second parser that can
  # disagree with the first is the bug this repository keeps shipping.
  review-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs the merge base to diff against, like check-track-scope.
          fetch-depth: 0
      - name: Verify the review artifact covers the merged tree
        run: node scripts/check-review-artifact.mjs "origin/${{ github.base_ref }}"

  build-and-audit:
    runs-on: ubuntu-latest
    # Production serves round badges as links; without this, CI would build
    # them as plain spans and every assertion about them would pass against
    # markup no visitor sees. Same failure mode as the analytics build that
    # was silently measured on the wrong server -- see the step at the end
    # of this job.
    env:
      NEXT_PUBLIC_REPO_URL: https://github.com/addicted2ai/AddictedtoAI
    steps:
      - uses: actions/checkout@v4
        with:
          # check-track-scope needs the merge base to diff against.
          fetch-depth: 0

      # A loop branch may only change files its track owns. allowedTools
      # removes capabilities but cannot scope Write to a directory, so this is
      # where the blast radius is actually fixed. Runs before anything else:
      # a scout run that shipped code should be told that, not made to wait
      # for Lighthouse first.
      - name: Check track scope
        run: |
          node scripts/check-track-scope.mjs \
            "origin/${{ github.base_ref }}" "${{ github.head_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - run: npm run lint

      # Before the build, because a malformed docket is a planning error and
      # should be reported as one rather than surfacing three minutes later
      # behind a Lighthouse run. Needs no server.
      - name: Check the docket
        run: node scripts/check-docket.mjs

      - run: npm run build

      - name: Start server
        run: npm run start & npx wait-on http://localhost:3000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/blog
            http://localhost:3000/directory
            http://localhost:3000/projects
            http://localhost:3000/demos
            http://localhost:3000/log
            http://localhost:3000/log/archive
          configPath: "./lighthouserc.json"
          uploadArtifacts: true

      - name: Check for broken links
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          # The 47 archived-round commit links are excluded here and checked
          # in scripts/check-routes.sh instead, by resolving each SHA against
          # this repository's own history. That is both stricter than an HTTP
          # request and immune to GitHub rate-limiting a shared CI runner,
          # which is how a green link check would otherwise start failing for
          # reasons that have nothing to do with the site.
          #
          # chatgpt.com is excluded for the same class of reason: Cloudflare
          # bot protection answers lychee's requests from shared GitHub
          # runners with 403 even though the page is live. The link is not
          # unchecked — scripts/check-routes.sh runs
          # scripts/check-tool-links.mjs, which resolves every Directory href
          # after redirects and fails on mismatch, and it passes for
          # chatgpt.com. Scoped to this host only; nothing this site can
          # verify itself is excluded.
          #
          # gemini.google.com is excluded on the same terms, added 2026-08-14
          # for round 98. lychee fails it deterministically with "HTTP/2
          # protocol error. Server may not support HTTP/2 properly" — three
          # runs, identical. The page is live: curl from a normal client
          # returns 200 over both --http2 and --http1.1, and
          # scripts/check-tool-links.mjs passes it. The fault is in the
          # runner's HTTP/2 client, not the link, so the exclusion removes a
          # false failure rather than a real check.
          #
          # Note on how this landed: round 98 was blocked by this check and
          # correctly refused to touch it — CHARTER.md rule 11 forbids a run
          # blocked by a guardrail from loosening it — and wrote docket/HOLD.md
          # asking for a human decision. The maintainer decided, and the
          # supervising model made the edit with the maintainer's credential.
          # A future round must not read this as licence to widen a guard that
          # is blocking it. Rule 11 still binds; the exception was a human's to
          # grant and it was granted once, for this host.
          args: --base http://localhost:3000 --exclude 'github\.com/addicted2ai/AddictedtoAI/commit/' --exclude 'chatgpt\.com' --exclude 'gemini\.google\.com' http://localhost:3000 http://localhost:3000/blog http://localhost:3000/directory http://localhost:3000/projects http://localhost:3000/demos http://localhost:3000/log http://localhost:3000/log/archive
          fail: true

      # The non-HTML routes are shipped code too, and nothing above
      # touches them: lychee only crawls the five pages. A feed that
      # 500s, a sitemap that stops listing a route, or a manifest that
      # is no longer valid JSON would all have gone unnoticed.
      - name: Check non-HTML routes and the 404
        if: always()
        run: bash scripts/check-routes.sh

      # Production serves the analytics build; the Lighthouse gate above
      # measures the analytics-OFF build, because this workflow doesn't
      # set the measurement ID. That gap is why this step exists. It is
      # informational on purpose -- assertions are warn-level in
      # lighthouserc.analytics.json, so it reports the real cost of
      # analytics on every PR without gating on a third-party script's
      # bad day.
      - name: Rebuild and serve with analytics enabled
        if: always()
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-CI0000000
        run: |
          # Serve on a different port rather than trying to kill the
          # first server. Killing it is a race that already went wrong
          # once: the kill silently did nothing, the new server died
          # with EADDRINUSE, wait-on succeeded against the *old*
          # analytics-off server, and Lighthouse happily measured the
          # wrong build and reported success.
          rm -rf .lighthouseci
          npm run build
          PORT=3001 npm run start & npx wait-on http://localhost:3001
          # And then prove it really is the analytics build. Without
          # this, any future breakage in the step above goes back to
          # silently measuring the wrong thing.
          curl -sf http://localhost:3001 | grep -q 'G-CI0000000'
          echo "confirmed: analytics build serving on :3001"

      - name: Lighthouse CI (analytics enabled, informational)
        if: always()
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://localhost:3001
          configPath: "./lighthouserc.analytics.json"
          uploadArtifacts: true
          # Distinct from the blocking run's artifact, which otherwise
          # collides: "an artifact with this name already exists".
          artifactName: lighthouse-results-analytics

      # Warn-level assertions print nothing when they pass, so without
      # this the number this whole sequence exists to surface would be
      # invisible. Writes to the job summary as well as the log.
      - name: Report analytics-enabled scores
        if: always()
        run: node scripts/report-lh-scores.mjs "Lighthouse with analytics enabled"
