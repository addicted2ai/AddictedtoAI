name: Loop

# The schedule is deliberately off.
#
# Until a dispatcher exists to pick a track from the docket and the quotas in
# policy.yml, an unattended run would have to choose its own track -- and
# "which kind of work should I do?" is the exact lever that produced ten rounds
# of the site refining its own scaffolding. See prompts/README.md.
#
# Runs are triggered by hand meanwhile, which is what has happened for every
# round so far and what the build log records as `supervised`. When the
# schedule comes back it belongs here:
#
#   schedule:
#     - cron: "0 */3 * * *"
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Which track this run is"
        required: true
        type: choice
        options: [scout, author, build, maintain, audit, meta]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Capability scope per track. This is the half that cannot be argued
      # with: a scout run has no Edit tool, so it cannot modify existing code
      # regardless of what it decides would be helpful.
      #
      # It is only half. allowedTools cannot scope Write to a directory --
      # scout needs Write to file docket items -- so the blast radius is fixed
      # by scripts/check-track-scope.mjs in pr-checks.yml, which rejects
      # changes outside the track's paths.
      - name: Resolve tool scope for ${{ inputs.track }}
        id: scope
        run: |
          case "${{ inputs.track }}" in
            scout)
              # No Edit: scout files work, it does not do the work.
              tools="Read,Write,Glob,Grep,Bash,WebSearch,WebFetch" ;;
            meta)
              # No web access: meta's charge is to fix what blocks other
              # tracks, and that answer is always inside the repository. With
              # a search tool it could justify any machinery change by finding
              # an article recommending it.
              tools="Read,Write,Edit,Glob,Grep,Bash" ;;
            *)
              tools="Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch" ;;
          esac
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "Track ${{ inputs.track }} -> $tools"

      - name: Load prompt
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            echo "You are running the **${{ inputs.track }}** track."
            echo
            echo "Read prompts/shared/every-run.md first, then"
            echo "prompts/tracks/${{ inputs.track }}.md, and follow them."
            echo
            echo "Your track was chosen for you. You may argue in the record"
            echo "that it was the wrong choice; you may not switch tracks."
            echo
            echo "Branch as loop/${{ inputs.track }}/<slug>. CI reads your"
            echo "track from that branch name and rejects changes outside"
            echo "your track's paths."
            echo
            echo "This run was started by hand, so its Origin is 'supervised'."
            echo PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run the ${{ inputs.track }} track
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: |
            --max-turns 40
            --allowedTools "${{ steps.scope.outputs.tools }}"
          show_full_output: true
