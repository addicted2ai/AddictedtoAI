name: Loop

# Every three hours, plus manual runs.
#
# The cadence buys responsiveness, not volume. Most runs should notice things
# rather than publish them -- the quotas in policy.yml weight scout and
# maintain heavily, and publishing has its own separate limits. Eight runs a
# day of *publishing* would be a content farm.
#
# A scheduled run does not choose its own track. scripts/dispatch.mjs picks
# one from the docket and the quotas before the run starts, because "what kind
# of work should I do?" is the lever that produced ten rounds of this site
# refining its own scaffolding: given the choice, a run picks work it can see,
# and what it can see is its own repository.
#
# The schedule is off while the tracks are being exercised by hand from local
# Claude Code and Codex installs. Those runs are supervised: a human is sitting
# there and can throw the result away, which is the only enforcement a local
# run gets, since it acts as the maintainer and the maintainer is an admin.
#
# Turn it back on by uncommenting the two lines below. Nothing else needs to
# change -- the dispatcher, the scoping and auto-merge all behave the same
# whether the run was scheduled or started by hand. Only Origin differs.
on:
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Force a track (leave empty to let the dispatcher choose)"
        required: false
        type: choice
        options: ["", scout, author, build, maintain, audit, meta]
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.pick.outputs.track }}
      reason: ${{ steps.pick.outputs.reason }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci

      - name: Pick a track
        id: pick
        run: |
          if [ -n "${{ inputs.track }}" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "reason=forced by hand" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Track forced: ${{ inputs.track }}"
          else
            node scripts/dispatch.mjs --github
            node scripts/dispatch.mjs
          fi

      - name: Summary
        run: |
          {
            echo "### Loop dispatch"
            echo
            echo "- Track: \`${{ steps.pick.outputs.track || 'none' }}\`"
            echo "- Reason: ${{ steps.pick.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: dispatch
    if: needs.dispatch.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capability scope per track. This is the half that cannot be argued
      # with: a scout run has no Edit tool, so it cannot modify existing code
      # regardless of what it decides would be helpful.
      #
      # It is only half. allowedTools cannot scope Write to a directory --
      # scout needs Write to file docket items -- so the blast radius is fixed
      # by scripts/check-track-scope.mjs in pr-checks.yml, which rejects
      # changes outside the track's paths.
      - name: Resolve tool scope
        id: scope
        run: |
          case "${{ needs.dispatch.outputs.track }}" in
            scout)
              # No Edit: scout files work, it does not do the work.
              tools="Read,Write,Glob,Grep,Bash,WebSearch,WebFetch" ;;
            meta)
              # No web access: meta's charge is to fix what blocks other
              # tracks, and that answer is always inside the repository. With
              # a search tool it could justify any machinery change by finding
              # an article recommending it.
              tools="Read,Write,Edit,Glob,Grep,Bash" ;;
            *)
              tools="Read,Write,Edit,Glob,Grep,Bash,WebSearch,WebFetch" ;;
          esac
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      # Assembled by the same script a local run uses, so a hand-started run
      # and a scheduled one are given identical instructions. Two copies of
      # this text would drift, and the difference would surface as tracks
      # behaving differently depending on who started them.
      - name: Build prompt
        id: prompt
        run: |
          origin=unsupervised
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            origin=supervised
          fi
          {
            echo 'content<<PROMPT_EOF'
            node scripts/build-prompt.mjs \
              --track "${{ needs.dispatch.outputs.track }}" --origin "$origin"
            echo PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      # No continue-on-error: a failed round must fail the job. The reporting
      # step below runs on `if: always()`, which reads the outcome without
      # swallowing it -- masking the failure to make it describable would be a
      # strange way to improve visibility.
      - name: Run the ${{ needs.dispatch.outputs.track }} track
        id: track_run
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.content }}
          # No turn limit. The 45-minute job timeout above is the runaway
          # guard, and inference is bounded by the maintainer's subscription
          # (CHARTER.md rule 15).
          #
          # There was a 40-turn cap here, inherited from the old single-prompt
          # loop that made one small change per round. It guaranteed that any
          # research-shaped track failed: the first real maintain run spent 41
          # turns fetching vendor pages and was cut off before it could commit
          # anything. Scout, maintain and audit all fetch external sources by
          # design -- that is the entire reason they have web access -- so a
          # limit tuned for a round that edits one file is a limit that stops
          # them working at all.
          claude_args: |
            --allowedTools "${{ steps.scope.outputs.tools }}"
          show_full_output: true

      # A run that dies mid-round produces nothing: no branch, no pull request,
      # and no changelog entry. The only trace is a red mark in a tab nobody is
      # watching, and "no round shipped" then looks identical to "no round was
      # attempted". Those are different facts, and CHARTER.md rule 8 does not
      # let the record keep only the flattering one.
      #
      # This cannot write to the record itself -- a failed run has nothing to
      # commit and the branch is protected -- so it makes the outcome legible
      # where it can, and names what a human needs to do about it.
      - name: Report the outcome
        if: always()
        env:
          TRACK: ${{ needs.dispatch.outputs.track }}
          REASON: ${{ needs.dispatch.outputs.reason }}
          RESULT: ${{ steps.track_run.outcome }}
        run: |
          {
            echo "### Loop run: \`$TRACK\`"
            echo
            echo "- Dispatcher: $REASON"
            echo "- Outcome: **$RESULT**"
            if [ "$RESULT" != "success" ]; then
              echo
              echo "This round shipped nothing and wrote no changelog entry."
              echo "Nothing records that it was attempted except this run."
              echo
              echo "Check the step log for the cause. A \`error_max_turns\`"
              echo "or timeout means the round was cut off mid-work, not that"
              echo "there was nothing to do."
              echo
              echo "\`node scripts/loop-history.mjs\` shows how often this is"
              echo "happening, which is the number that matters."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
